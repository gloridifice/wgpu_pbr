[package]
name = "wgpu_pbr"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/*"]

[workspace.dependencies]
rand = "0.8.5"
half = "2.6.0"
bytemuck = { version = "1.19.0", features = ["derive"] }

# graphics
winit = { version = "0.30", features = ["rwh_05"] }
wgpu = { version = "24", features = ["naga-ir"] }
naga_oil = "0.17.0"
cgmath = "0.18.0"

# bevy
bevy_ecs = "0.16"
bevy_app = "0.16"
bevy_log = "0.16"


[dependencies]
color-backtrace = { version = "0.7" }
env_logger = "0.11"
pollster = "0.4.0"
uuid = { version = "1.11.0", features = ["v4"] }
anyhow = "1.0.92"
lazy_static = "1.5.0"
derive_builder = "0.20.2"
tiny_bail = "0.4.3"
bevy_reflect = "0.16"

# egui
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
egui_dock = "0.16"
egui_tiles = "0.12"

# Workspace
lentille_render = { path = "crates/lentille_render" }
lentille_core = { path = "crates/lentille_core" }
